name: Release .rav

# Push a tag like v1.0.0 to build the package and attach it to a GitHub release.
# "Run workflow" builds it too and keeps it as a run artifact, without a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # The framework is not part of this repo (it is gitignored). Clone it next to the app, not
      # inside it, so it can never end up in the package.
      - name: Install the Raven framework
        run: |
          git clone --depth 1 https://github.com/RavenResonance/raven-framework.git ../raven-framework
          pip install -e ../raven-framework pytest

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: Build the package
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/build_rav.py --out "overblaster-${GITHUB_REF_NAME}.rav"

      - name: Check the package leaves the framework out
        run: |
          if unzip -l overblaster-*.rav | grep -qi "raven.framework"; then
            echo "the framework is in the package"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: overblaster-rav
          path: overblaster-*.rav

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" overblaster-*.rav --title "OverBlaster $GITHUB_REF_NAME" --generate-notes
